
name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # --- Backend ---
      - name: Build Strapi backend image
        run: |
         OWNER=${{ github.repository_owner }}
         OWNER_LC=${OWNER,,}
         docker build -t ghcr.io/$OWNER_LC/portfolio-strapi:latest ./backend
         docker push ghcr.io/$OWNER_LC/portfolio-strapi:latest

      # --- Frontend ---
      - name: Build Next.js frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/portfolio-frontend:latest ./frontend
          docker push ghcr.io/${{ github.repository_owner }}/portfolio-frontend:latest
