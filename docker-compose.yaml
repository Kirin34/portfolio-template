version: "3.9"

services:
  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: strapi-backend
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi

      APP_KEYS: devkey1,devkey2
      API_TOKEN_SALT: token_salt
      ADMIN_JWT_SECRET: jwtsecret
      TRANSFER_TOKEN_SALT: transfer_salt
      JWT_SECRET: jwtsecret

      NODE_OPTIONS: --max-old-space-size=4096
    mem_limit: 4g
    volumes:
      - ./backend:/app
      - ./backend/public/uploads:/app/public/uploads
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_STRAPI_URL: http://strapi:1337
      NODE_ENV: production
    depends_on:
      - strapi
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: strapi-postgres
    restart: always
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
